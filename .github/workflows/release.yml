name: Wydanie na macOS

# Trzy sposoby uruchomienia:
# 1. Actions → „Wydanie na macOS” → Run workflow → wpisz wersję (np. 1.2.0): powstaje tag v1.2.0 i wydanie z plikami.
# 2. Wypchnięcie tagu v1.2.0 z terminala: to samo.
# 3. Pull request: tylko próbny build i testy (pliki do pobrania jako artefakty, bez wydania).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Wersja, np. 1.2.0"
        required: true
        type: string
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - "electron/**"
      - "scripts/**"
      - "src/**"
      - "*.json"
      - "vite.desktop.config.ts"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build .dmg / .zip (Apple Silicon + Intel)
    runs-on: macos-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Ustal wersję
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version || '0.0.0'")"
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Wersja „$VERSION” musi mieć postać 1.2.3"
            exit 1
          fi
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION już istnieje — podaj wyższą wersję."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Wersja: $VERSION"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Pliki lock wskazują na prywatny rejestr Lovable, niedostępny z GitHuba,
      # więc instalujemy z publicznego npm według zakresów z package.json.
      - name: Zainstaluj zależności
        run: npm install --no-package-lock --no-audit --no-fund --ignore-scripts --registry=https://registry.npmjs.org

      - name: Testy
        run: npx vitest run

      - name: Zbuduj i spakuj aplikację
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/package-mac.mjs --arch all

      - name: Sprawdź, czy aplikacja startuje (Apple Silicon)
        shell: bash
        run: |
          APP="release/LeadFinder-darwin-arm64/LeadFinder.app"
          test -f "$APP/Contents/Resources/app/dist/client/_shell.html"
          codesign --verify --deep --strict "$APP"
          # Uruchamiamy proces główny na kilka sekund: błąd require() lub składni zakończyłby go od razu.
          "$APP/Contents/MacOS/LeadFinder" > launch.log 2>&1 &
          PID=$!
          sleep 12
          if ! kill -0 "$PID" 2>/dev/null; then
            echo "::error::Aplikacja zakończyła się zaraz po starcie"
            cat launch.log
            exit 1
          fi
          kill "$PID" || true
          cat launch.log

      - uses: actions/upload-artifact@v4
        with:
          name: LeadFinder-${{ steps.version.outputs.version }}-macOS
          path: |
            release/*.dmg
            release/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Opublikuj wydanie
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: LeadFinder-${{ needs.build.outputs.version }}-macOS
          path: release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: LeadFinder ${{ needs.build.outputs.version }}
          body_path: .github/release-notes.md
          generate_release_notes: true
          make_latest: true
          files: |
            release/*.dmg
            release/*.zip
